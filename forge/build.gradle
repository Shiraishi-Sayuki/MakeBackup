// プラグインを設定する
// Forge用のプラグインを適用する
plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

// Forge設定をする
legacyForge {
    // Forgeバージョンを指定する
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    // Parchmentマッピングを設定する
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    // 実行設定をする
    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    // MOD設定をする
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// リソース設定をする
// 生成されたリソースを登録する
sourceSets.main.resources.srcDir 'src/generated/resources'

// 依存関係を追加する
dependencies {
    // 共通プロジェクトをコンパイル時のみに含める
    compileOnly project(":common")
    // Lombokを設定する
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // 依存ライブラリをJar内に内包する
    jarJar(implementation 'org.quartz-scheduler:quartz:2.3.2')
    jarJar(implementation 'com.mchange:c3p0:0.9.5.4')
    jarJar(implementation 'com.zaxxer:HikariCP-java7:2.4.13')
    jarJar(implementation 'com.mchange:mchange-commons-java:0.2.15')
    jarJar(implementation 'com.github.mwiede:jsch:0.2.24')
    jarJar(implementation 'commons-net:commons-net:3.11.0')
    jarJar(implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8')
    jarJar(implementation 'org.apache.httpcomponents:fluent-hc:4.5.14')
    jarJar(implementation 'org.apache.httpcomponents:httpclient:4.5.14')
    jarJar(implementation 'org.apache.httpcomponents:httpcore:4.4.16')
    jarJar(implementation 'commons-codec:commons-codec:1.17.1')
    jarJar(implementation 'commons-logging:commons-logging:1.2')
    jarJar(implementation 'com.google.api-client:google-api-client:2.7.2')
    jarJar(implementation 'com.google.http-client:google-http-client:1.45.2')
    jarJar(implementation 'com.google.http-client:google-http-client-gson:1.45.2')
    jarJar(implementation 'com.google.oauth-client:google-oauth-client:1.36.0')
    jarJar(implementation 'com.google.oauth-client:google-oauth-client-java6:1.36.0')
    jarJar(implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0')
    jarJar(implementation 'com.google.auth:google-auth-library-credentials:1.30.0')
    jarJar(implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.0')
    jarJar(implementation 'com.google.apis:google-api-services-drive:v3-rev20250329-2.0.0')
    jarJar(implementation 'io.grpc:grpc-api:1.68.2')
    jarJar(implementation 'io.grpc:grpc-context:1.68.2')
    jarJar(implementation 'io.opencensus:opencensus-api:0.31.1')
    jarJar(implementation 'io.opencensus:opencensus-contrib-http-util:0.31.1')
    jarJar(implementation 'com.google.auto.value:auto-value-annotations:1.11.0')
    jarJar(implementation 'com.google.errorprone:error_prone_annotations:2.36.0')
    jarJar(implementation 'com.google.j2objc:j2objc-annotations:3.0.0')
    jarJar(implementation 'org.checkerframework:checker-qual:3.43.0')

    jarJar(implementation "net.kyori:adventure-api:${adventure_version}")
    jarJar(implementation "net.kyori:adventure-key:${adventure_version}")
    jarJar(implementation "net.kyori:examination-api:1.3.0")
    jarJar(implementation "net.kyori:examination-string:1.3.0")
    jarJar(implementation "net.kyori:adventure-text-serializer-gson:${adventure_version}")
    jarJar(implementation "net.kyori:adventure-text-serializer-json:${adventure_version}")
    jarJar(implementation "net.kyori:adventure-text-serializer-legacy:${adventure_version}")
}

// Jarタスクを設定する
jar {
    finalizedBy('reobfJar')
}
