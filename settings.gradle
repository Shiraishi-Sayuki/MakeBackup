// プラグイン管理を設定する
pluginManagement {
    // リポジトリを設定する
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

// プラグインを設定する
// ツールチェーンの自動解決プラグインを追加する
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// プロジェクト設定をする
// ルートプロジェクト名を設定する
rootProject.name = 'MakeBackup'
// サブプロジェクトを登録する
include("common")
include("fabric")
include("forge")
